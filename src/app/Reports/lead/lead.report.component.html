<div class="container-fluid mt-2">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h6 class="mb-0 fw-bold">Lead Report</h6>
    </div>

    <div class="card-body p-0">
      <div *ngIf="error" class="alert alert-danger m-3">
        <strong>Error:</strong> {{ error }}
      </div>

      <div class="ag-theme-alpine grid-container" [style.height]="loading ? '400px' : '500px'">
        <ag-grid-angular
          #agGrid
          style="width: 100%; height: 100%;"
          [rowData]="rowData"
          [columnDefs]="columnDefs"
          [defaultColDef]="defaultColDef"
          [rowSelection]="'single'"
          [animateRows]="true"
          [headerHeight]="40"
          [rowHeight]="40"
          [suppressHorizontalScroll]="true">
        </ag-grid-angular>
      </div>
    </div>

    <div class="card-footer text-muted text-center py-2">
      Total Lead: {{ loading ? 'Loading...' : rowData.length }}
    </div>
  </div>
</div>
